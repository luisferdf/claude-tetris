<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle-section">
          <span class="label">MODO CLARO</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-switch" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="preview-row">
          <div class="panel-section">
            <span class="label">HOLD</span>
            <canvas id="hold-canvas" width="64" height="64"></canvas>
          </div>
          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="64" height="64"></canvas>
          </div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="score-name-form" class="score-name-form hidden">
          <span class="label">¡Nueva puntuación en el top 5!</span>
          <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="save-score-btn">Guardar</button>
        </div>

        <div class="highscores-block">
          <span class="label">TOP 5</span>
          <ol id="overlay-highscores" class="highscore-list"></ol>
          <p class="max-lines">Máx. líneas: <span id="overlay-max-lines">0</span></p>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-scores-btn-overlay" class="reset-scores-btn">Resetear records</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>

        <div class="highscores-block">
          <span class="label">TOP 5</span>
          <ol id="start-highscores" class="highscore-list"></ol>
          <p class="max-lines">Máx. líneas: <span id="start-max-lines">0</span></p>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-scores-btn-start" class="reset-scores-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
